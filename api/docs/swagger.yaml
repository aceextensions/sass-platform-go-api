basePath: /api
definitions:
  domain.Account:
    properties:
      code:
        description: '"1001", "2000"'
        type: string
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      name:
        description: '"Cash on Hand", "Sales Revenue"'
        type: string
      parentId:
        description: For hierarchical CoA
        type: string
      tenantId:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/domain.AccountType'
        description: ASSET, LIABILITY, etc.
      updatedAt:
        type: string
    type: object
  domain.AccountType:
    enum:
    - ASSET
    - LIABILITY
    - EQUITY
    - REVENUE
    - EXPENSE
    type: string
    x-enum-varnames:
    - AccountTypeAsset
    - AccountTypeLiability
    - AccountTypeEquity
    - AccountTypeRevenue
    - AccountTypeExpense
  domain.ChannelType:
    enum:
    - SMS
    - EMAIL
    - WHATSAPP
    - IN_APP
    type: string
    x-enum-varnames:
    - ChannelSMS
    - ChannelEmail
    - ChannelWhatsApp
    - ChannelInApp
  domain.JournalEntry:
    properties:
      createdAt:
        type: string
      createdByUserId:
        type: string
      description:
        type: string
      fiscalYearId:
        type: string
      id:
        type: string
      lines:
        items:
          $ref: '#/definitions/domain.JournalLine'
        type: array
      postedAt:
        type: string
      referenceId:
        description: InvoiceID, PaymentID
        type: string
      referenceType:
        description: '"INVOICE", "PAYMENT", "MANUAL"'
        type: string
      status:
        $ref: '#/definitions/domain.JournalStatus'
      tenantId:
        type: string
      transactionDate:
        type: string
      updatedAt:
        type: string
    type: object
  domain.JournalLine:
    properties:
      accountId:
        type: string
      credit:
        type: number
      debit:
        type: number
      description:
        type: string
      id:
        type: string
      journalEntryId:
        type: string
    type: object
  domain.JournalStatus:
    enum:
    - DRAFT
    - POSTED
    type: string
    x-enum-varnames:
    - JournalStatusDraft
    - JournalStatusPosted
  domain.LedgerEntry:
    properties:
      accountId:
        type: string
      credit:
        type: number
      debit:
        type: number
      description:
        description: Journal Entry description
        type: string
      id:
        type: string
      journalEntryId:
        type: string
      lineDescription:
        description: Line specific description
        type: string
      stepBalance:
        description: Calculated during report generation
        type: number
      transactionDate:
        type: string
    type: object
  domain.Notification:
    properties:
      channel:
        $ref: '#/definitions/domain.ChannelType'
      content:
        type: string
      createdAt:
        type: string
      errorMessage:
        type: string
      id:
        type: string
      priority:
        $ref: '#/definitions/domain.Priority'
      recipient:
        type: string
      retryCount:
        type: integer
      sentAt:
        type: string
      status:
        $ref: '#/definitions/domain.NotificationStatus'
      subject:
        type: string
      templateId:
        type: string
      tenantId:
        type: string
      userId:
        type: string
    type: object
  domain.NotificationStatus:
    enum:
    - PENDING
    - PROCESSING
    - SENT
    - FAILED
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusProcessing
    - StatusSent
    - StatusFailed
  domain.Priority:
    enum:
    - HIGH
    - LOW
    type: string
    x-enum-varnames:
    - PriorityHigh
    - PriorityLow
  dto.BalanceSheetResponse:
    properties:
      assets:
        $ref: '#/definitions/dto.FinancialSection'
      date:
        type: string
      equity:
        $ref: '#/definitions/dto.FinancialSection'
      liabilities:
        $ref: '#/definitions/dto.FinancialSection'
      netAssets:
        description: Assets - Liabilities
        type: number
    type: object
  dto.CreateAccountRequest:
    properties:
      code:
        type: string
      description:
        type: string
      name:
        type: string
      parentId:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/domain.AccountType'
        enum:
        - ASSET
        - LIABILITY
        - EQUITY
        - REVENUE
        - EXPENSE
    required:
    - code
    - name
    - type
    type: object
  dto.CreateJournalEntryRequest:
    properties:
      date:
        type: string
      description:
        type: string
      fiscalYearId:
        type: string
      lines:
        items:
          $ref: '#/definitions/dto.JournalLineRequest'
        minItems: 2
        type: array
      referenceId:
        type: string
      referenceType:
        type: string
    required:
    - date
    - description
    - fiscalYearId
    - lines
    type: object
  dto.DayBookItem:
    properties:
      amount:
        type: number
      description:
        type: string
      journalId:
        type: string
      type:
        description: SALES, PURCHASE, RECEIPT, PAYMENT
        type: string
    type: object
  dto.DayBookResponse:
    properties:
      date:
        type: string
      totalCredits:
        type: number
      totalDebits:
        type: number
      transactions:
        items:
          $ref: '#/definitions/dto.DayBookItem'
        type: array
    type: object
  dto.FinancialReportItem:
    properties:
      accountId:
        type: string
      accountName:
        type: string
      balance:
        type: number
      code:
        type: string
    type: object
  dto.FinancialSection:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.FinancialReportItem'
        type: array
      name:
        description: e.g., "Current Assets", "Revenue"
        type: string
      total:
        type: number
    type: object
  dto.JournalLineRequest:
    properties:
      accountId:
        type: string
      credit:
        minimum: 0
        type: number
      debit:
        minimum: 0
        type: number
      description:
        type: string
    required:
    - accountId
    type: object
  dto.ProfitLossResponse:
    properties:
      endDate:
        type: string
      expenses:
        $ref: '#/definitions/dto.FinancialSection'
      netProfit:
        description: Revenue - Expenses
        type: number
      revenue:
        $ref: '#/definitions/dto.FinancialSection'
      startDate:
        type: string
    type: object
  dto.TrialBalanceItem:
    properties:
      accountCode:
        type: string
      accountId:
        type: string
      accountName:
        type: string
      accountType:
        type: string
      balance:
        description: Net balance (Debit - Credit)
        type: number
      credit:
        type: number
      debit:
        type: number
    type: object
  dto.TrialBalanceResponse:
    properties:
      fiscalYearId:
        type: string
      generatedAt:
        type: string
      items:
        items:
          $ref: '#/definitions/dto.TrialBalanceItem'
        type: array
      totalCredit:
        type: number
      totalDebit:
        type: number
    type: object
  dto.UpdateAccountRequest:
    properties:
      code:
        type: string
      description:
        type: string
      isActive:
        type: boolean
      name:
        type: string
      parentId:
        type: string
      type:
        $ref: '#/definitions/domain.AccountType'
    type: object
  handler.CategoryResponse:
    properties:
      categoryCode:
        type: string
      createdAt:
        type: string
      customAttributes:
        additionalProperties: true
        type: object
      description:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      level:
        type: integer
      name:
        type: string
      parentId:
        type: string
      path:
        type: string
      sortOrder:
        type: integer
      tenantId:
        type: string
      updatedAt:
        type: string
    type: object
  handler.CreateCategoryRequest:
    properties:
      customAttributes:
        additionalProperties: true
        type: object
      description:
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
      parentId:
        type: string
      sortOrder:
        type: integer
    required:
    - name
    type: object
  handler.CreateCustomerRequest:
    properties:
      customAttributes:
        additionalProperties: true
        type: object
      customerType:
        enum:
        - individual
        - business
        type: string
      email:
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
      phone:
        type: string
    required:
    - customerType
    - name
    type: object
  handler.CreatePlanRequest:
    properties:
      code:
        type: string
      description:
        type: string
      features:
        additionalProperties:
          type: boolean
        type: object
      interval:
        enum:
        - MONTHLY
        - YEARLY
        type: string
      limits:
        additionalProperties:
          type: integer
        type: object
      name:
        type: string
      price:
        minimum: 0
        type: number
    required:
    - code
    - name
    type: object
  handler.CreateProductRequest:
    properties:
      barcode:
        type: string
      categoryId:
        type: string
      costPrice:
        minimum: 0
        type: number
      customAttributes:
        additionalProperties: true
        type: object
      description:
        type: string
      mrp:
        type: number
      name:
        maxLength: 255
        minLength: 2
        type: string
      sellingPrice:
        type: number
      sku:
        type: string
      taxRate:
        maximum: 100
        minimum: 0
        type: number
      unit:
        type: string
    required:
    - categoryId
    - name
    - sellingPrice
    - unit
    type: object
  handler.CreateSupplierRequest:
    properties:
      customAttributes:
        additionalProperties: true
        type: object
      email:
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
      phone:
        type: string
      supplierType:
        enum:
        - local
        - international
        type: string
    required:
    - name
    - supplierType
    type: object
  handler.CreateTemplateRequest:
    properties:
      body:
        type: string
      channel:
        type: string
      code:
        type: string
      subject:
        type: string
    required:
    - body
    - channel
    - code
    type: object
  handler.CustomerResponse:
    properties:
      createdAt:
        type: string
      customAttributes:
        additionalProperties: true
        type: object
      customerCode:
        type: string
      customerType:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      status:
        type: string
      tenantId:
        type: string
      updatedAt:
        type: string
    type: object
  handler.ProductResponse:
    properties:
      barcode:
        type: string
      categoryId:
        type: string
      costPrice:
        type: number
      createdAt:
        type: string
      customAttributes:
        additionalProperties: true
        type: object
      description:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      mrp:
        type: number
      name:
        type: string
      productCode:
        type: string
      sellingPrice:
        type: number
      sku:
        type: string
      status:
        type: string
      taxRate:
        type: number
      tenantId:
        type: string
      unit:
        type: string
      updatedAt:
        type: string
    type: object
  handler.SendNotificationRequest:
    properties:
      channel:
        type: string
      content:
        type: string
      priority:
        type: string
      recipient:
        type: string
      templateId:
        type: string
      userId:
        type: string
      variables:
        additionalProperties: true
        type: object
    required:
    - channel
    - recipient
    type: object
  handler.SubscribeRequest:
    properties:
      password:
        type: string
      planId:
        type: string
    required:
    - password
    - planId
    type: object
  handler.SupplierResponse:
    properties:
      createdAt:
        type: string
      customAttributes:
        additionalProperties: true
        type: object
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      status:
        type: string
      supplierCode:
        type: string
      supplierType:
        type: string
      tenantId:
        type: string
      updatedAt:
        type: string
    type: object
  handler.TemplateResponse:
    properties:
      body:
        type: string
      channel:
        type: string
      code:
        type: string
      createdAt:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      subject:
        type: string
      tenantId:
        type: string
      updatedAt:
        type: string
    type: object
  handler.UpdateCategoryRequest:
    properties:
      customAttributes:
        additionalProperties: true
        type: object
      description:
        type: string
      isActive:
        type: boolean
      name:
        maxLength: 255
        minLength: 2
        type: string
      parentId:
        type: string
      sortOrder:
        type: integer
    required:
    - name
    type: object
  handler.UpdateCustomerRequest:
    properties:
      customAttributes:
        additionalProperties: true
        type: object
      customerType:
        enum:
        - individual
        - business
        type: string
      email:
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
      phone:
        type: string
      status:
        enum:
        - active
        - inactive
        - blocked
        type: string
    required:
    - customerType
    - name
    - status
    type: object
  handler.UpdateProductRequest:
    properties:
      barcode:
        type: string
      categoryId:
        type: string
      costPrice:
        minimum: 0
        type: number
      customAttributes:
        additionalProperties: true
        type: object
      description:
        type: string
      mrp:
        type: number
      name:
        maxLength: 255
        minLength: 2
        type: string
      sellingPrice:
        type: number
      sku:
        type: string
      status:
        enum:
        - active
        - inactive
        - discontinued
        type: string
      taxRate:
        maximum: 100
        minimum: 0
        type: number
      unit:
        type: string
    required:
    - categoryId
    - name
    - sellingPrice
    - status
    - unit
    type: object
  handler.UpdateSupplierRequest:
    properties:
      customAttributes:
        additionalProperties: true
        type: object
      email:
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
      phone:
        type: string
      status:
        enum:
        - active
        - inactive
        - blocked
        type: string
      supplierType:
        enum:
        - local
        - international
        type: string
    required:
    - name
    - status
    - supplierType
    type: object
host: localhost:4000
info:
  contact: {}
  description: High performance Go API for AceExtension
  title: AceExtension API
  version: "1.0"
paths:
  /api/v1/accounting/accounts:
    get:
      description: List all accounts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Account'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List Accounts
      tags:
      - Accounting
    post:
      consumes:
      - application/json
      description: Create a new account
      parameters:
      - description: Account Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Account'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create Account
      tags:
      - Accounting
  /api/v1/accounting/accounts/{id}:
    get:
      description: Get account by ID
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Account'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Account
      tags:
      - Accounting
    put:
      consumes:
      - application/json
      description: Update account details
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update Account
      tags:
      - Accounting
  /api/v1/accounting/journals:
    get:
      description: List journal entries
      parameters:
      - description: Fiscal Year ID
        in: query
        name: fiscalYearId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.JournalEntry'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List Journal Entries
      tags:
      - Accounting
    post:
      consumes:
      - application/json
      description: Create a new manual journal entry
      parameters:
      - description: Journal Entry Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateJournalEntryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.JournalEntry'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create Journal Entry
      tags:
      - Accounting
  /api/v1/accounting/journals/{id}:
    get:
      description: Get journal entry by ID
      parameters:
      - description: Journal Entry ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.JournalEntry'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Journal Entry
      tags:
      - Accounting
  /api/v1/accounting/journals/{id}/post:
    post:
      description: Post/Finalize a journal entry
      parameters:
      - description: Journal Entry ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Post Journal Entry
      tags:
      - Accounting
  /api/v1/accounting/reports/balance-sheet:
    get:
      description: Get balance sheet as of a specific date
      parameters:
      - description: As Of Date (YYYY-MM-DD)
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BalanceSheetResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Balance Sheet
      tags:
      - Accounting
  /api/v1/accounting/reports/day-book:
    get:
      description: Get all transactions for a specific date
      parameters:
      - description: Date (YYYY-MM-DD)
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DayBookResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Day Book
      tags:
      - Accounting
  /api/v1/accounting/reports/general-ledger:
    get:
      description: Get general ledger entries for an account within a date range
      parameters:
      - description: Account ID
        in: query
        name: accountId
        required: true
        type: string
      - description: Start Date (YYYY-MM-DD)
        in: query
        name: startDate
        required: true
        type: string
      - description: End Date (YYYY-MM-DD)
        in: query
        name: endDate
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.LedgerEntry'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get General Ledger
      tags:
      - Accounting
  /api/v1/accounting/reports/profit-loss:
    get:
      description: Get P&L for a date range
      parameters:
      - description: Start Date (YYYY-MM-DD)
        in: query
        name: startDate
        required: true
        type: string
      - description: End Date (YYYY-MM-DD)
        in: query
        name: endDate
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProfitLossResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Profit and Loss
      tags:
      - Accounting
  /api/v1/accounting/reports/trial-balance:
    get:
      description: Get full trial balance
      parameters:
      - description: Fiscal Year ID
        in: query
        name: fiscalYearId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TrialBalanceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Trial Balance
      tags:
      - Accounting
