basePath: /api
definitions:
  domain.Account:
    properties:
      code:
        description: '"1001", "2000"'
        type: string
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      name:
        description: '"Cash on Hand", "Sales Revenue"'
        type: string
      parentId:
        description: For hierarchical CoA
        type: string
      tenantId:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/domain.AccountType'
        description: ASSET, LIABILITY, etc.
      updatedAt:
        type: string
    type: object
  domain.AccountType:
    enum:
    - ASSET
    - LIABILITY
    - EQUITY
    - REVENUE
    - EXPENSE
    type: string
    x-enum-varnames:
    - AccountTypeAsset
    - AccountTypeLiability
    - AccountTypeEquity
    - AccountTypeRevenue
    - AccountTypeExpense
  domain.ChannelType:
    enum:
    - SMS
    - EMAIL
    - WHATSAPP
    - IN_APP
    type: string
    x-enum-varnames:
    - ChannelSMS
    - ChannelEmail
    - ChannelWhatsApp
    - ChannelInApp
  domain.JournalEntry:
    properties:
      createdAt:
        type: string
      createdByUserId:
        type: string
      description:
        type: string
      fiscalYearId:
        type: string
      id:
        type: string
      lines:
        items:
          $ref: '#/definitions/domain.JournalLine'
        type: array
      postedAt:
        type: string
      referenceId:
        description: InvoiceID, PaymentID
        type: string
      referenceType:
        description: '"INVOICE", "PAYMENT", "MANUAL"'
        type: string
      status:
        $ref: '#/definitions/domain.JournalStatus'
      tenantId:
        type: string
      transactionDate:
        type: string
      updatedAt:
        type: string
    type: object
  domain.JournalLine:
    properties:
      accountId:
        type: string
      credit:
        type: number
      debit:
        type: number
      description:
        type: string
      id:
        type: string
      journalEntryId:
        type: string
    type: object
  domain.JournalStatus:
    enum:
    - DRAFT
    - POSTED
    type: string
    x-enum-varnames:
    - JournalStatusDraft
    - JournalStatusPosted
  domain.LedgerEntry:
    properties:
      accountId:
        type: string
      credit:
        type: number
      debit:
        type: number
      description:
        description: Journal Entry description
        type: string
      id:
        type: string
      journalEntryId:
        type: string
      lineDescription:
        description: Line specific description
        type: string
      stepBalance:
        description: Calculated during report generation
        type: number
      transactionDate:
        type: string
    type: object
  domain.Notification:
    properties:
      channel:
        $ref: '#/definitions/domain.ChannelType'
      content:
        type: string
      createdAt:
        type: string
      errorMessage:
        type: string
      id:
        type: string
      priority:
        $ref: '#/definitions/domain.Priority'
      recipient:
        type: string
      retryCount:
        type: integer
      sentAt:
        type: string
      status:
        $ref: '#/definitions/domain.NotificationStatus'
      subject:
        type: string
      templateId:
        type: string
      tenantId:
        type: string
      userId:
        type: string
    type: object
  domain.NotificationStatus:
    enum:
    - PENDING
    - PROCESSING
    - SENT
    - FAILED
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusProcessing
    - StatusSent
    - StatusFailed
  domain.Priority:
    enum:
    - HIGH
    - LOW
    type: string
    x-enum-varnames:
    - PriorityHigh
    - PriorityLow
  domain.TransactionType:
    enum:
    - IN
    - OUT
    - TRANSFER
    - ADJUSTMENT
    type: string
    x-enum-comments:
      TransactionTypeAdjustment: Stock Take correction
      TransactionTypeIn: Purchase, Return In
      TransactionTypeOut: Sales, Return Out, Damage
      TransactionTypeTransfer: Warehouse to Warehouse
    x-enum-descriptions:
    - Purchase, Return In
    - Sales, Return Out, Damage
    - Warehouse to Warehouse
    - Stock Take correction
    x-enum-varnames:
    - TransactionTypeIn
    - TransactionTypeOut
    - TransactionTypeTransfer
    - TransactionTypeAdjustment
  dto.AccountDTO:
    properties:
      category:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  dto.AuthResponse:
    properties:
      accessToken:
        type: string
      accounts:
        items:
          $ref: '#/definitions/dto.AccountDTO'
        type: array
      refreshToken:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.BalanceSheetResponse:
    properties:
      assets:
        $ref: '#/definitions/dto.FinancialSection'
      date:
        type: string
      equity:
        $ref: '#/definitions/dto.FinancialSection'
      liabilities:
        $ref: '#/definitions/dto.FinancialSection'
      netAssets:
        description: Assets - Liabilities
        type: number
    type: object
  dto.ChangePasswordDTO:
    properties:
      newPassword:
        minLength: 6
        type: string
      oldPassword:
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  dto.CreateAccountRequest:
    properties:
      code:
        type: string
      description:
        type: string
      name:
        type: string
      parentId:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/domain.AccountType'
        enum:
        - ASSET
        - LIABILITY
        - EQUITY
        - REVENUE
        - EXPENSE
    required:
    - code
    - name
    - type
    type: object
  dto.CreateJournalEntryRequest:
    properties:
      date:
        type: string
      description:
        type: string
      fiscalYearId:
        type: string
      lines:
        items:
          $ref: '#/definitions/dto.JournalLineRequest'
        minItems: 2
        type: array
      referenceId:
        type: string
      referenceType:
        type: string
    required:
    - date
    - description
    - fiscalYearId
    - lines
    type: object
  dto.DayBookItem:
    properties:
      amount:
        type: number
      description:
        type: string
      journalId:
        type: string
      type:
        description: SALES, PURCHASE, RECEIPT, PAYMENT
        type: string
    type: object
  dto.DayBookResponse:
    properties:
      date:
        type: string
      totalCredits:
        type: number
      totalDebits:
        type: number
      transactions:
        items:
          $ref: '#/definitions/dto.DayBookItem'
        type: array
    type: object
  dto.FinancialReportItem:
    properties:
      accountId:
        type: string
      accountName:
        type: string
      balance:
        type: number
      code:
        type: string
    type: object
  dto.FinancialSection:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.FinancialReportItem'
        type: array
      name:
        description: e.g., "Current Assets", "Revenue"
        type: string
      total:
        type: number
    type: object
  dto.ForgotPasswordDTO:
    properties:
      identifier:
        type: string
    required:
    - identifier
    type: object
  dto.InventoryItemResponse:
    properties:
      id:
        type: string
      lastRestocked:
        type: string
      productId:
        type: string
      quantity:
        type: number
      reorderLevel:
        type: number
      warehouseId:
        type: string
    type: object
  dto.InviteUserDTO:
    properties:
      email:
        type: string
      phone:
        maxLength: 15
        minLength: 10
        type: string
      role:
        enum:
        - owner
        - manager
        - staff
        - admin
        type: string
    required:
    - role
    type: object
  dto.JoinTenantDTO:
    properties:
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 6
        type: string
      token:
        type: string
    required:
    - name
    - password
    - token
    type: object
  dto.JournalLineRequest:
    properties:
      accountId:
        type: string
      credit:
        minimum: 0
        type: number
      debit:
        minimum: 0
        type: number
      description:
        type: string
    required:
    - accountId
    type: object
  dto.LoginDTO:
    properties:
      password:
        type: string
      phone:
        type: string
    required:
    - password
    - phone
    type: object
  dto.LogoutDTO:
    properties:
      refreshToken:
        type: string
    type: object
  dto.Pagination:
    properties:
      currentPage:
        type: integer
      limit:
        type: integer
      totalItems:
        type: integer
      totalPages:
        type: integer
    type: object
  dto.ProfitLossResponse:
    properties:
      endDate:
        type: string
      expenses:
        $ref: '#/definitions/dto.FinancialSection'
      netProfit:
        description: Revenue - Expenses
        type: number
      revenue:
        $ref: '#/definitions/dto.FinancialSection'
      startDate:
        type: string
    type: object
  dto.RefreshTokenDTO:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  dto.RegisterIndividualDTO:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 50
        minLength: 6
        type: string
      phone:
        maxLength: 15
        minLength: 10
        type: string
    required:
    - name
    - password
    - phone
    type: object
  dto.RegisterTenantDTO:
    properties:
      email:
        type: string
      ownerName:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 50
        minLength: 6
        type: string
      phone:
        maxLength: 15
        minLength: 10
        type: string
      tenantName:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - ownerName
    - password
    - phone
    - tenantName
    type: object
  dto.ResetPasswordDTO:
    properties:
      identifier:
        type: string
      newPassword:
        maxLength: 50
        minLength: 6
        type: string
      otp:
        type: string
    required:
    - identifier
    - newPassword
    - otp
    type: object
  dto.StockTransactionResponse:
    properties:
      createdAt:
        type: string
      createdBy:
        type: string
      direction:
        type: integer
      id:
        type: string
      notes:
        type: string
      productId:
        type: string
      quantity:
        type: number
      referenceId:
        type: string
      referenceType:
        type: string
      type:
        $ref: '#/definitions/domain.TransactionType'
      warehouseId:
        type: string
    type: object
  dto.TrialBalanceItem:
    properties:
      accountCode:
        type: string
      accountId:
        type: string
      accountName:
        type: string
      accountType:
        type: string
      balance:
        description: Net balance (Debit - Credit)
        type: number
      credit:
        type: number
      debit:
        type: number
    type: object
  dto.TrialBalanceResponse:
    properties:
      fiscalYearId:
        type: string
      generatedAt:
        type: string
      items:
        items:
          $ref: '#/definitions/dto.TrialBalanceItem'
        type: array
      totalCredit:
        type: number
      totalDebit:
        type: number
    type: object
  dto.UpdateAccountRequest:
    properties:
      code:
        type: string
      description:
        type: string
      isActive:
        type: boolean
      name:
        type: string
      parentId:
        type: string
      type:
        $ref: '#/definitions/domain.AccountType'
    type: object
  dto.UserListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.UserResponse'
        type: array
      pagination:
        $ref: '#/definitions/dto.Pagination'
    type: object
  dto.UserResponse:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      name:
        type: string
      phone:
        type: string
      role:
        type: string
      tenantId:
        type: string
    type: object
  dto.VerifyOTPDTO:
    properties:
      otp:
        type: string
      phone:
        type: string
    required:
    - otp
    - phone
    type: object
  dto.WarehouseResponse:
    properties:
      description:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      location:
        type: string
      name:
        type: string
      tenantId:
        type: string
    type: object
  handler.CategoryResponse:
    properties:
      categoryCode:
        type: string
      createdAt:
        type: string
      customAttributes:
        additionalProperties: true
        type: object
      description:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      level:
        type: integer
      name:
        type: string
      parentId:
        type: string
      path:
        type: string
      sortOrder:
        type: integer
      tenantId:
        type: string
      updatedAt:
        type: string
    type: object
  handler.CreateCategoryRequest:
    properties:
      customAttributes:
        additionalProperties: true
        type: object
      description:
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
      parentId:
        type: string
      sortOrder:
        type: integer
