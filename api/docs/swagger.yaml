  handler.CreateProductRequest:
    properties:
      barcode:
        type: string
      categoryId:
        type: string
      costPrice:
        minimum: 0
        type: number
      customAttributes:
        additionalProperties: true
        type: object
      description:
        type: string
      mrp:
        type: number
      name:
        maxLength: 255
        minLength: 2
        type: string
      sellingPrice:
        type: number
      sku:
        type: string
      taxRate:
        maximum: 100
