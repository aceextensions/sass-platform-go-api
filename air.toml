root = "."
test_dir = ""
tmp_dir = "tmp"

[build]
  bin = "./tmp/main"
  cmd = "cd api && swag init -g cmd/api/main.go -o docs --parseDependency --parseInternal --dir ./,../accounting,../crm,../catalog,../subscription,../notification,../fiscal,../identity,../inventory,../sales,../purchase && cd .. && go build -buildvcs=false -o ./tmp/main ./api/cmd/api/"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "node_modules", "api/docs"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "toml", "env"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
